'use strict';
const Missions=(()=>{

const CAMPAIGNS={orbital:{id:'orbital',name:'Helios Reach',subtitle:'Outer-system survey',missionCount:45,flavor:'Thread a survey vessel through unstable orbits and silent relay gates.',accent:'#39C6F0',philosophy:'Structured objectives, priority chains and increasingly strict timing.'},abyss:{id:'abyss',name:'Abyssal Signal',subtitle:'Hadal research expedition',missionCount:36,flavor:'Follow impossible sonar returns beneath the last mapped contour.',accent:'#24D9B1',philosophy:'Variable objective packages assembled from a difficulty budget.'},ember:{id:'ember',name:'Emberline',subtitle:'Storm-rescue airships',missionCount:42,flavor:'Coordinate rescue flights through a continent-sized electrical supercell.',accent:'#F28B38',philosophy:'Timing windows, linked rescues and volatile trick targets.'}};

const TITLES={orbital:['Lagrange Trace','Cold Arc','Perihelion Gate','Far Beacon','Glass Orbit','Silent Vector'],abyss:['Thermocline','Black Smoker','Hadal Rift','Cold Seep','Midnight Shelf','Pressure Choir'],ember:['Squall Line','Static Crown','Ash Corridor','Crosswind','Lightning Shelf','Rescue Window']};

function missionFor(campaign='orbital',number=1,playerCount=4){const meta=CAMPAIGNS[campaign]||CAMPAIGNS.orbital,safeNumber=Math.max(1,Math.min(meta.missionCount,number)),rng=seeded(safeNumber*7919+playerCount*97+campaign.length*31),difficulty=Math.min(6,1+Math.floor((safeNumber-1)/(meta.missionCount/6)));let tasks;if(campaign==='abyss')tasks=abyssTasks(rng,safeNumber,playerCount);else if(campaign==='ember')tasks=emberTasks(rng,safeNumber,playerCount);else tasks=orbitalTasks(rng,safeNumber,playerCount);return{id:`${campaign}-${safeNumber}`,campaign,number:safeNumber,difficulty,title:`${pick(rng,TITLES[campaign]||TITLES.orbital)} ${String(safeNumber).padStart(2,'0')}`,tasks,rules:rulesFor(campaign,safeNumber)}}
return{CAMPAIGNS,taskLabel,ruleNotes,missionFor};})();

const Game=(()=>{
const SUITS=['blue','yellow','green','pink'],ROCKET='rocket';
function makeDeck(){const cards=[];for(const suit of SUITS)for(let value=1;value<=9;value++)cards.push({id:`${suit}-${value}`,suit,value});for(let value=1;value<=4;value++)cards.push({id:`rocket-${value}`,suit:ROCKET,value});return cards}

function taskWithState(task,index){return{id:task.id||`task-${index}`,seat:Number.isInteger(task.seat)?task.seat:null,complete:false,failed:false,progress:0,...structuredClone(task)}}
function createGame({playerCount=4,seed=Date.now(),mode='orbital',mission=null}={}){if(playerCount<2||playerCount>5)throw new Error('OpenCrew supports 2-5 human/table slots');const relayMode=playerCount===2,effectivePlayerCount=relayMode?3:playerCount,relaySeat=relayMode?2:null,hands=deal(effectivePlayerCount,seed),captain=hands.findIndex(h=>h.some(c=>c.id==='rocket-4')),taskState=(mission?.tasks||[]).map(taskWithState),hasUnassigned=taskState.some(t=>!Number.isInteger(t.seat)),communication=Array.from({length:effectivePlayerCount},(_,seat)=>({used:seat===relaySeat,locked:seat===relaySeat,cardId:null,position:null}));return{version:2,mode,seed,requestedPlayerCount:playerCount,playerCount:effectivePlayerCount,relaySeat,hands,captain,leader:captain,currentPlayer:captain,phase:hasUnassigned?'assigning':'playing',trick:[],trickNo:1,maxTricks:Math.floor(40/effectivePlayerCount),captured:Array.from({length:effectivePlayerCount},()=>[]),tricksWon:Array.from({length:effectivePlayerCount},()=>0),communication,mission,taskState,status:'playing',history:[]}}
function assignTask(state,seat,taskId){if(state.status!=='playing'||state.phase!=='assigning')return{ok:false,error:'NOT_ASSIGNING'};if(seat!==state.currentPlayer)return{ok:false,error:'NOT_YOUR_ASSIGNMENT_TURN'};const task=state.taskState.find(t=>t.id===taskId);if(!task||Number.isInteger(task.seat))return{ok:false,error:'TASK_UNAVAILABLE'};task.seat=seat;state.history.push({type:'assign-task',seat,taskId});const remaining=state.taskState.filter(t=>!Number.isInteger(t.seat));if(!remaining.length){state.phase='playing';state.leader=state.captain;state.currentPlayer=state.captain;state.history.push({type:'phase',phase:'playing'});return{ok:true,phase:'playing'}}state.currentPlayer=(seat+1)%state.playerCount;return{ok:true,phase:'assigning'}}
