name: Patch final UI geometry

on:
  push:
    paths:
      - '.github/workflows/patch-ui-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch standalone UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "else if(k==='styleObj')Object.assign(n.style,v);"
          new = "else if(k==='styleObj'){for(const[sk,sv]of Object.entries(v)){if(sk.startsWith('--'))n.style.setProperty(sk,sv);else n.style[sk]=sv}}"
          if old not in s:
              raise SystemExit('styleObj target not found')
          s = s.replace(old, new, 1)
          old_mobile = ".hand:has(.card:nth-child(13)) .card{margin-left:-44px}.hand .card:first-child{margin-left:0}"
          new_mobile = ".hand:has(.card:nth-child(13)) .card{margin-left:-47px}.hand{padding:10px 0;max-width:100%}.hand .card:first-child{margin-left:0}"
          if old_mobile not in s:
              raise SystemExit('mobile hand target not found')
          s = s.replace(old_mobile, new_mobile, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "OpenCrew CI"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: center crew seats and fit long mobile hands"
          git push
