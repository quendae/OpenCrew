name: Apply game feel polish

on:
  push:
    paths:
      - '.github/workflows/apply-game-feel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch standalone game feel
        shell: python
        run: |
          exec(open('.github/scripts/apply_game_feel.py', encoding='utf-8').read())
      - name: Commit game feel polish
        run: |
          git config user.name "OpenCrew CI"
          git config user.email "actions@users.noreply.github.com"
          git add index.html tests/e2e/game-feel.spec.mjs
          git commit -m "feat: animate trick play and collection"
          git push
